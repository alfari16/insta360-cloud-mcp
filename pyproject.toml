[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insta360-cloud-mcp"
version = "0.1.0"
description = "MCP server for Insta360 cloud — browse, download, and manage media"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Alif Irfan Anshory" }]
keywords = ["mcp", "insta360", "cloud", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
insta360-cloud-mcp = "insta360_cloud_mcp.server:main"
